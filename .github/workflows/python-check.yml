name: Python Check

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  python-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check Python syntax
        run: python -m py_compile src/network_scanner.py

      - name: Run unit tests
        run: python -m unittest discover -s tests

      - name: Run scanner against localhost demo
        run: python src/network_scanner.py --target 127.0.0.1 --ports 22,80,443 --timeout 0.5 --output reports --format all
